<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Look Lab">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<title>Look Lab</title>
<style>
:root{--bg:#0d0e12;--p:#171920;--fg:#eceef3;--mut:#8b90a0;--line:#262a35;--a1:#ffb454;--a2:#ff5c8a;--g:linear-gradient(135deg,var(--a1),var(--a2));--on:#16110a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f1ee;--p:#fff;--fg:#1b1c20;--mut:#6c707c;--line:#e0ddd8;--on:#fff}}
:root[data-theme="light"]{--bg:#f3f1ee;--p:#fff;--fg:#1b1c20;--mut:#6c707c;--line:#e0ddd8;--on:#fff}
*{-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:15px/1.35 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}button{font:inherit;color:var(--fg);cursor:pointer}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding:8px 10px;box-sizing:border-box}
.top{display:flex;align-items:center;gap:8px}.brand{font-weight:800;letter-spacing:.3px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
#msg{flex:1;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:38px;height:38px;border-radius:50%;padding:0;display:grid;place-items:center;border:1px solid var(--line);background:var(--p)}.ic:disabled{opacity:.35}
.stage{background:radial-gradient(circle at 50% 25%,var(--p),var(--bg));border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;min-height:0}
#cw{position:relative;display:none;touch-action:manipulation;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}#cv{width:100%;height:100%;display:block}
.empty{color:var(--mut);text-align:center;padding:24px;font-size:14px}
.badge{position:absolute;top:10px;left:10px;background:var(--g);color:var(--on);font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;display:none}
.tools{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:10px;max-height:38dvh;overflow:auto}
@media (orientation:landscape){.app{grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr)}.top{grid-column:1/-1}.tools{max-height:none}}
.tabs{display:flex;gap:6px}.tabs button{flex:1;height:36px;border-radius:10px;border:0;background:transparent;color:var(--mut);display:grid;place-items:center;padding:0}.tabs .on{background:var(--g);color:var(--on)}
.panel{display:flex;flex-direction:column;gap:9px}.panel[hidden]{display:none}.row{display:flex;gap:6px;flex-wrap:wrap}
.sm,.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:transparent;font-size:13px;white-space:nowrap}.chip{flex:0 0 auto;display:flex;gap:6px;align-items:center}.chip i{font-style:normal;opacity:.7}.chip.on{background:var(--g);color:var(--on);border-color:transparent;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
label.sl{display:grid;grid-template-columns:76px 1fr 38px;align-items:center;gap:8px;font-size:13px;color:var(--mut)}label.sl span{text-align:right;color:var(--fg)}input[type=range]{width:100%;margin:0;accent-color:#ff8a5c}
.sub{color:var(--mut);font-size:12px;margin:0}
#crop{position:absolute;inset:0;display:none;touch-action:none}#cb{position:absolute;border:1.5px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.58);background:linear-gradient(#fff5 1px,#0000 1px) 0 33.3%/100% 33.4%,linear-gradient(90deg,#fff5 1px,#0000 1px) 33.3% 0/33.4% 100%}
#cb i{position:absolute;width:26px;height:26px;margin:-10px;border:4px solid var(--a1)}[data-h=nw]{left:0;top:0;border-right:0!important;border-bottom:0!important}[data-h=ne]{right:0;top:0;border-left:0!important;border-bottom:0!important}[data-h=sw]{left:0;bottom:0;border-right:0!important;border-top:0!important}[data-h=se]{right:0;bottom:0;border-left:0!important;border-top:0!important}
.pad{position:relative;width:min(220px,60vw);aspect-ratio:1;margin:0 auto;border:1px solid var(--line);border-radius:12px;touch-action:none;background:linear-gradient(to right,rgba(255,165,30,.65),rgba(255,165,30,0) 45%,rgba(60,120,255,0) 55%,rgba(60,120,255,.65)),linear-gradient(to bottom,rgba(50,200,90,.55),rgba(50,200,90,0) 45%,rgba(220,50,200,0) 55%,rgba(220,50,200,.55)),#888}
.pad:before,.pad:after{content:"";position:absolute;background:rgba(255,255,255,.5)}.pad:before{left:50%;top:0;bottom:0;width:1px}.pad:after{top:50%;left:0;right:0;height:1px}
.dot{position:absolute;width:18px;height:18px;margin:-9px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);z-index:1}
.dots{display:flex;gap:10px;justify-content:center}.dots button{width:30px;height:30px;padding:0;border-radius:50%;border:3px solid transparent}.dots .on{border-color:var(--fg)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;z-index:5}.ov img{max-width:100%;max-height:70%;border-radius:8px}.ov p{color:#fff;text-align:center;margin:0;font-size:14px}.ov .sm{color:#fff}
</style></head><body><div class="app">
<div class="top"><b class="brand">Look Lab</b><span id="msg"></span><button class="ic" id="pick" title="Open photo"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg></button><button class="ic" id="save" disabled title="Save"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg></button></div>
<div class="stage" id="stage"><div class="empty" id="empty">Tap the photo icon to open an image.<br>Tap and hold the photo to see the original.</div><div id="cw"><canvas id="cv"></canvas><div id="crop"><div id="cb"><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i></div></div></div><span class="badge" id="badge">Original</span></div>
<div class="tools"><div class="tabs" id="tabs"><button data-t="look" class="on" title="Look"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 010 16z" fill="currentColor"/></svg></button><button data-t="crop" title="Crop"><svg viewBox="0 0 24 24"><path d="M7 3v14h14M3 7h14v14"/></svg></button><button data-t="wb" title="White balance"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg></button><button data-t="hsl" title="Colour"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="5"/><circle cx="15" cy="9" r="5"/><circle cx="12" cy="15" r="5"/></svg></button></div>
<div class="panel" id="p-look"><div class="chips" id="chips"></div><label class="sl">Strength<input type="range" id="amt" min="0" max="100" value="100"><span id="amtv">100%</span></label><div class="row"><button class="sm" id="addlut">Add LUT (.cube)</button></div></div>
<div class="panel" id="p-crop" hidden><div class="row"><button class="sm" id="rl">↺ 90°</button><button class="sm" id="rr">↻ 90°</button><button class="sm" id="sw">⇄ Flip ratio</button><button class="sm" id="rc">Reset</button></div><div class="chips" id="ars"></div><label class="sl">Straighten<input type="range" id="ang" min="-150" max="150" value="0"><span id="angv">0.0°</span></label><p class="sub">Drag the corners or the box to crop.</p></div>
<div class="panel" id="p-wb" hidden><div class="pad" id="pad"><div class="dot" id="dot" style="left:50%;top:50%"></div></div><div class="sub" style="text-align:center" id="wbv">Amber–Blue 0.0 · Green–Magenta 0.0</div><div class="row"><button class="sm" id="wbr">Reset</button></div></div>
<div class="panel" id="p-hsl" hidden><div class="dots" id="dots"></div><label class="sl">Hue<input type="range" id="s0" min="-100" max="100" value="0"><span id="v0">0</span></label><label class="sl">Saturation<input type="range" id="s1" min="-100" max="100" value="0"><span id="v1">0</span></label><label class="sl">Luminance<input type="range" id="s2" min="-100" max="100" value="0"><span id="v2">0</span></label><div class="row"><button class="sm" id="hr">Reset colours</button></div></div></div>
<input type="file" id="fphoto" accept="image/*" hidden><input type="file" id="flut" multiple hidden>
</div>
<div class="ov" id="ov"><img id="ovimg" alt="Result"><p>Press and hold the image, then choose “Save to Photos”.</p><a id="ovdl" class="sm" style="color:#fff">Download file</a><button class="sm" id="ovx">Close</button></div>

let luts=[],cur=0,amt=1,bmp=null,fname='photo',orig=null,work=null,cv=$('#cv'),ctx=cv.getContext('2d',{willReadFrequently:true}),raf=0;
const msg=t=>{$('#msg').textContent=t||''};
function b64ToF32(b){const bin=atob(b),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);const u=new Uint16Array(u8.buffer),f=new Float32Array(u.length);for(let i=0;i<u.length;i++)f[i]=u[i]/65535;return f}
function f32ToB64(f){const u=new Uint16Array(f.length);for(let i=0;i<f.length;i++)u[i]=Math.round(Math.min(1,Math.max(0,f[i]))*65535);const u8=new Uint8Array(u.buffer);let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s)}
function parseCube(t){let n=0;const v=[];for(const l of t.split(/\r?\n/)){const s=l.trim();if(!s||s[0]==='#')continue;if(s.startsWith('LUT_3D_SIZE')){n=+s.split(/\s+/)[1];continue}if(/^[A-Za-z_]/.test(s))continue;const p=s.split(/\s+/);if(p.length>=3)v.push(+p[0],+p[1],+p[2])}if(!n||v.length!==n*n*n*3)throw new Error('not a valid 3D .cube');return{size:n,data:Float32Array.from(v)}}
function save(){try{localStorage.setItem('looklab.luts',JSON.stringify(luts.filter(l=>l.custom).map(l=>({name:l.name,size:l.size,b64:f32ToB64(l.data)}))))}catch(e){msg('Couldn’t store that LUT on this device, but it works for this session.')}}
function load(){luts=[{name:BUILTIN.name,size:BUILTIN.size,data:b64ToF32(BUILTIN.b64)}];try{for(const l of JSON.parse(localStorage.getItem('looklab.luts')||'[]'))luts.push({name:l.name,size:l.size,data:b64ToF32(l.b64),custom:true})}catch(e){}}
function chips(){const c=$('#chips');c.innerHTML='';luts.forEach((l,i)=>{const b=document.createElement('button');b.className='chip'+(i===cur?' on':'');b.textContent=l.name;if(l.custom){const x=document.createElement('i');x.textContent='×';x.onclick=e=>{e.stopPropagation();luts.splice(i,1);if(cur>=luts.length)cur=0;save();chips();draw()};b.appendChild(x)}b.onclick=()=>{cur=i;chips();draw()};c.appendChild(b)})}
function applyLut(src,dst,L,a){const n=L.size,m=n-1,D=L.data,s=src.data,o=dst.data,s1=3,s2=3*n,s3=3*n*n,len=s.length,k255=m/255;
for(let i=0;i<len;i+=4){const r=s[i]*k255,g=s[i+1]*k255,b=s[i+2]*k255;let r0=r|0,g0=g|0,b0=b|0;if(r0>=m)r0=m-1;if(g0>=m)g0=m-1;if(b0>=m)b0=m-1;
const fr=r-r0,fg=g-g0,fb=b-b0,k=r0*s1+g0*s2+b0*s3;
for(let c=0;c<3;c++){const q=k+c;
const c00=D[q]+(D[q+s1]-D[q])*fr,c10=D[q+s2]+(D[q+s2+s1]-D[q+s2])*fr,c01=D[q+s3]+(D[q+s3+s1]-D[q+s3])*fr,c11=D[q+s2+s3]+(D[q+s2+s3+s1]-D[q+s2+s3])*fr;
const c0=c00+(c10-c00)*fg,c1=c01+(c11-c01)*fg,v=c0+(c1-c0)*fb;
o[i+c]=s[i+c]*(1-a)+v*255*a}
o[i+3]=255}}
let q=0,ang=0,ar=0,cr={x:0,y:0,w:1,h:1},wbx=0,wby=0,band=0,tab='look',G={},hsl=Array.from({length:8},()=>[0,0,0]);
const HC=[0,30,60,120,180,240,275,320],HCOL=['#e5483d','#ee8a2e','#e8cf2a','#3fb454','#2cc3c3','#3b78e0','#8a5cd6','#d452b4'];
function fr(){return q%2?bmp.height/bmp.width:bmp.width/bmp.height}
function geo(max,full){const sw=bmp.width,sh=bmp.height,o=q%2,W0=o?sh:sw,H0=o?sw:sh,k=Math.min(1,max/Math.max(W0,H0)),Fw=W0*k,Fh=H0*k,t=ang*Math.PI/180,a=Math.abs(t),s=Math.cos(a)+Math.sin(a)*Math.max(W0,H0)/Math.min(W0,H0),R=full?{x:0,y:0,w:1,h:1}:cr;
const c=document.createElement('canvas');c.width=Math.max(1,Math.round(R.w*Fw));c.height=Math.max(1,Math.round(R.h*Fh));const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingQuality='high';
x.translate(Fw/2-R.x*Fw,Fh/2-R.y*Fh);x.rotate(q*Math.PI/2+t);x.scale(k*s,k*s);x.drawImage(bmp,-sw/2,-sh/2);return c}
function wbFx(d){if(!wbx&&!wby)return;const t=wbx/7*.22,u=wby/7*.18,r=1-t,g=1-u,b=1+t;for(let i=0;i<d.length;i+=4){d[i]*=r;d[i+1]*=g;d[i+2]*=b}}
function hslFx(d){const act=[];hsl.forEach((v,j)=>{if(v[0]||v[1]||v[2])act.push(j)});if(!act.length)return;
for(let i=0;i<d.length;i+=4){const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,dl=mx-mn;if(dl<.004)continue;
const s=dl/(1-Math.abs(2*l-1)+1e-9);let h=60*(mx===r?((g-b)/dl+6)%6:mx===g?(b-r)/dl+2:(r-g)/dl+4),dh=0,ds=0,dL=0;
for(const j of act){let df=Math.abs(h-HC[j]);if(df>180)df=360-df;const w=1-df/50;if(w>0){dh+=hsl[j][0]*.3*w;ds+=hsl[j][1]/100*w;dL+=hsl[j][2]/400*w*s}}
h=(h+dh+360)%360;const s2=Math.min(1,Math.max(0,s*(1+ds))),l2=Math.min(1,Math.max(0,l+dL)),aa=s2*Math.min(l2,1-l2),f=n=>{const k=(n+h/30)%12;return(l2-aa*Math.max(-1,Math.min(k-3,9-k,1)))*255};d[i]=f(0);d[i+1]=f(8);d[i+2]=f(4)}}
function pipe(im){wbFx(im.data);applyLut(im,im,luts[cur],amt);hslFx(im.data)}
function draw(){if(!orig)return;cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{work.data.set(orig.data);pipe(work);ctx.putImageData(work,0,0)})}
const cw=$('#cw'),crop=$('#crop'),cb=$('#cb');
function fit(){const s=$('#stage').getBoundingClientRect(),ra=cv.width/cv.height||1,w=Math.min(s.width-16,(s.height-16)*ra);cw.style.width=w+'px';cw.style.height=w/ra+'px'}
function cropUi(){crop.style.display=tab==='crop'?'block':'none';cb.style.left=cr.x*100+'%';cb.style.top=cr.y*100+'%';cb.style.width=cr.w*100+'%';cb.style.height=cr.h*100+'%'}
function rebuild(){if(!bmp)return;const c=geo(1100,tab==='crop');cv.width=c.width;cv.height=c.height;orig=c.getContext('2d').getImageData(0,0,c.width,c.height);work=ctx.createImageData(c.width,c.height);work.data.set(orig.data);pipe(work);ctx.putImageData(work,0,0);fit();cropUi()}

async function openPhoto(f){msg('Loading…');try{try{bmp=await createImageBitmap(f,{imageOrientation:'from-image'})}catch(e){const u=URL.createObjectURL(f),im=new Image();im.src=u;await im.decode();bmp=await createImageBitmap(im)}
fname=f.name.replace(/\.[^.]+$/,'');resetGeo();cw.style.display='block';$('#empty').style.display='none';$('#save').disabled=false;msg('');rebuild()}catch(e){msg('Couldn’t read that photo.')}}
async function saveFull(){if(!bmp)return;msg('Processing full size…');$('#save').disabled=true;await new Promise(r=>setTimeout(r,30));
try{const c=geo(1e9),x=c.getContext('2d'),id=x.getImageData(0,0,c.width,c.height);pipe(id);x.putImageData(id,0,0);
const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.95)),name=fname+'_'+luts[cur].name.replace(/\s+/g,'-')+'.jpg',file=new File([blob],name,{type:'image/jpeg'});msg('');
if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}}
const u=URL.createObjectURL(blob);$('#ovimg').src=u;$('#ovdl').href=u;$('#ovdl').download=name;$('#ov').style.display='flex'}catch(e){msg('Couldn’t process the full-size photo.')}finally{$('#save').disabled=false}}
$('#pick').onclick=()=>$('#fphoto').click();$('#fphoto').onchange=e=>{if(e.target.files[0])openPhoto(e.target.files[0]);e.target.value=''};
$('#addlut').onclick=()=>$('#flut').click();
$('#flut').onchange=async e=>{for(const f of e.target.files){try{const p=parseCube(await f.text());luts.push({name:f.name.replace(/\.cube$/i,''),size:p.size,data:p.data,custom:true});cur=luts.length-1;msg('')}catch(er){msg('“'+f.name+'” isn’t a valid 3D .cube file.')}}e.target.value='';save();chips();draw()};
$('#amt').oninput=e=>{amt=e.target.value/100;$('#amtv').textContent=e.target.value+'%';draw()};
$('#save').onclick=saveFull;$('#ovx').onclick=()=>{$('#ov').style.display='none'};
const showO=()=>{if(orig){ctx.putImageData(orig,0,0);$('#badge').style.display='block'}},hideO=()=>{$('#badge').style.display='none';draw()};
let ht=0,sh=0;cw.addEventListener('pointerdown',()=>{if(tab==='crop'||!orig)return;ht=setTimeout(()=>{sh=1;showO()},220)});
const endH=()=>{clearTimeout(ht);if(sh){sh=0;hideO()}};['pointerup','pointercancel','pointerleave'].forEach(n=>cw.addEventListener(n,endH));cw.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{const was=tab;tab=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));['look','crop','wb','hsl'].forEach(n=>$('#p-'+n).hidden=n!==tab);if((was==='crop')!==(tab==='crop'))rebuild()});
const rot=d=>{q=(q+d)%4;ar=0;cr={x:0,y:0,w:1,h:1};document.querySelectorAll('#ars .chip').forEach((x,i)=>x.classList.toggle('on',i===0));rebuild()};

$('#ang').oninput=e=>{ang=e.target.value/10;$('#angv').textContent=ang.toFixed(1)+'°';reb()};
$('#rc').onclick=()=>{resetGeo();rebuild()};
function setAr(v){ar=v;if(!v||!bmp)return;const f=fr();let w=1,h=f/v;if(h>1){h=1;w=v/f}cr={x:(1-w)/2,y:(1-h)/2,w,h};cropUi()}
[['Free',0],['Original',-1],['1:1',1],['4:5',.8],['3:2',1.5],['16:9',16/9]].forEach(([n,v],i)=>{const b=document.createElement('button');b.className='chip'+(i===0?' on':'');b.textContent=n;b.onclick=()=>{if(!bmp)return;setAr(v<0?fr():v);document.querySelectorAll('#ars .chip').forEach(x=>x.classList.toggle('on',x===b))};$('#ars').appendChild(b)});
